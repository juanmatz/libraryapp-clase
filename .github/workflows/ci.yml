name: Java CI con Maven

# Controla cuándo se ejecutará la automatización
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Descarga el código del repositorio
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Paso 2: Configura el entorno de Java (JDK)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Acelera la descarga de dependencias

      # Paso 3: Compila y corre los tests
      - name: Ejecutar pruebas unitarias con Maven
        run: mvn clean test